name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # v6 defaults to a golangci-lint v1.x binary that's too old to parse
        # a go.mod targeting this new a Go version; v7 is the first major
        # built for v2, matching the v2.13.2 installed locally (brew).
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: backend
          version: v2.13.2

      - name: go test
        run: go test -race ./...
