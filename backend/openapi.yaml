openapi: 3.0.3
info:
  title: rip API
  description: >
    Opens simulated Magic: The Gathering booster packs. Pack contents follow
    the real printed booster structure of the chosen set. Unofficial Fan
    Content permitted under the Fan Content Policy; not approved or
    endorsed by Wizards of the Coast.
  version: "1.0"
servers:
  - url: /

paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/sets:
    get:
      summary: List sets available to open
      description: Sets are ordered newest release first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SetSummary"

  /v1/packs/open:
    post:
      summary: Open one pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [set_code]
              properties:
                set_code:
                  type: string
                  example: FDN
                booster_type:
                  type: string
                  description: Defaults to "play", the only type rip currently opens.
                  example: play
      responses:
        "201":
          description: Pack opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackOpen"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          description: No active booster config for that set/booster_type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/packs/{id}:
    get:
      summary: Fetch a previously opened pack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackOpen"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/sets/{code}/pack.png:
    get:
      summary: Fetch a set's booster pack photo
      description: >
        The official pack photo with its studio background removed,
        processed and served by this API (not the external source it was
        derived from). Cacheable indefinitely: the URL's ?v= changes
        whenever the image does.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: FDN
        - name: v
          in: query
          required: false
          description: Cache-buster; ignored by the server.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: pack open not found

    SetSummary:
      type: object
      properties:
        code:
          type: string
          example: FDN
        name:
          type: string
          example: Foundations
        pack_image_url:
          type: string
          nullable: true
          description: >
            Path to this API's own GET /v1/sets/{code}/pack.png (with a
            content-hash ?v= query param), not an external URL. Null if
            this set has no pack photo.
          example: /v1/sets/FDN/pack.png?v=4f43e42d64dbc9534c49500f8275e2c2
        pack_price_eur:
          type: number
          nullable: true
          description: Cardmarket trend price (EUR) of one sealed booster, as of pack_priced_at. Null if unpriced.
          example: 4.36
        pack_priced_at:
          type: string
          format: date-time
          nullable: true
        booster_types:
          type: array
          items:
            type: string
          example: [play]

    CardSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, mythic, special, bonus]
        collector_number:
          type: string
        set_code:
          type: string
        image_uris:
          type: object
          description: >
            Either {"image_uris": {...}} for a single-faced card, or
            {"faces": [{"name","image_uris"}, ...]} for a double-faced one.
            Images are Scryfall's own, shown whole and unaltered.

    CardPick:
      type: object
      properties:
        slot:
          type: integer
        sheet_name:
          type: string
          example: rareMythicWithShowcase
        foil:
          type: boolean
        card:
          $ref: "#/components/schemas/CardSummary"
        price_eur:
          type: number
          nullable: true
          description: >
            Cardmarket trend price (EUR) of this pick: the foil price for a
            foil pick when Cardmarket lists one, else the non-foil price.
            Null when the card is unpriced.
          example: 0.25

    PackOpen:
      type: object
      properties:
        open_id:
          type: string
          format: uuid
        set_code:
          type: string
        booster_type:
          type: string
        config_version:
          type: integer
        created_at:
          type: string
          format: date-time
        cards:
          type: array
          items:
            $ref: "#/components/schemas/CardPick"
        pricing:
          $ref: "#/components/schemas/Pricing"

    Pricing:
      type: object
      description: Value summary of the pack. Prices are as of priced_at (last Cardmarket refresh), not as of the open.
      properties:
        pack_price_eur:
          type: number
          nullable: true
          example: 4.36
        total_value_eur:
          type: number
          description: Sum of price_eur over priced picks, rounded to cents.
          example: 12.4
        unpriced_cards:
          type: integer
          description: Picks with no price, excluded from total_value_eur.
          example: 1
        priced_at:
          type: string
          format: date-time
          nullable: true
