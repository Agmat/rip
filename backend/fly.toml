app = "rip-mtg-api"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  ALLOWED_ORIGIN = "https://rip.gabrielcabanes.com"

[deploy]
  release_command = "/migrate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
