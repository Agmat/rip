services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rip
      POSTGRES_PASSWORD: rip
      POSTGRES_DB: rip
    ports:
      - "5432:5432"
    volumes:
      - rip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rip -d rip"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  rip-postgres-data:
